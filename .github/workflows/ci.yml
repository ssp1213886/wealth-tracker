name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run audit
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ''

  e2e:
    # 端到端回归：假云端 + 无头 Chrome（runner 自带 google-chrome），不碰生产数据
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright-core
      - run: npm run build
      - run: npm run e2e
        env:
          PW_CORE_PATH: ${{ github.workspace }}/node_modules/playwright-core
          # v370：显式给出系统 Chrome —— runner 自带 google-chrome，但 driver-engine.mjs 的候选路径
          # 以前只有 Windows 两条，导致 e2e:all 的「真机模拟」段在 CI 上必然失败（test 绿、e2e 红）。
          CHROME_PATH: /usr/bin/google-chrome

      # v322：常跑总入口 —— 把"按需再跑"的专项脚本也一起跑（全站回归 47 项 / 期权 / 备份 / 分析卡 /
      # 同步全链路 / 真机模拟触摸端）。脚本不常跑必腐烂：上一轮就是靠终测才发现两个脚本早已过时。
      - run: npm run e2e:all
        env:
          PW_CORE_PATH: ${{ github.workspace }}/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
